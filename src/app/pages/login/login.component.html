<div class="flex justify-center mt-20">
  <div class="bg-white p-6 shadow rounded w-80">

    <h2 class="text-xl mb-4">Login</h2>

    <input [(ngModel)]="email" placeholder="Email" class="w-full border p-2 mb-3">
    <input [(ngModel)]="password" type="password" placeholder="Password" class="w-full border p-2 mb-3">

    <button (click)="login()" class="w-full bg-black text-white p-2">
      Login
    </button>

  </div>
</div>
