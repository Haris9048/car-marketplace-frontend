<div class="flex justify-center mt-20">

  <div class="bg-white p-6 shadow rounded w-80">

    <h2 class="text-xl mb-4 text-center">
      Signup
    </h2>

    <form
      [formGroup]="signupForm"
      (ngSubmit)="signup()">

      <!-- Name -->

      <input
        formControlName="name"
        placeholder="Name"
        class="w-full border p-2 mb-1 rounded">

      <p
        *ngIf="
          signupForm.get('name')?.touched &&
          signupForm.get('name')?.invalid
        "
        class="text-red-500 text-sm mb-3">

        Name is required

      </p>

      <!-- Email -->

      <input
        formControlName="email"
        placeholder="Email"
        class="w-full border p-2 mb-1 rounded">

      <p
        *ngIf="
          signupForm.get('email')?.touched &&
          signupForm.get('email')?.errors?.['required']
        "
        class="text-red-500 text-sm mb-3">

        Email is required

      </p>

      <p
        *ngIf="
          signupForm.get('email')?.touched &&
          signupForm.get('email')?.errors?.['email']
        "
        class="text-red-500 text-sm mb-3">

        Enter a valid email

      </p>

      <!-- Password -->

      <input
        formControlName="password"
        type="password"
        placeholder="Password"
        class="w-full border p-2 mb-1 rounded">

      <p
        *ngIf="
          signupForm.get('password')?.touched &&
          signupForm.get('password')?.errors?.['required']
        "
        class="text-red-500 text-sm mb-3">

        Password is required

      </p>

      <p
        *ngIf="
          signupForm.get('password')?.touched &&
          signupForm.get('password')?.errors?.['minlength']
        "
        class="text-red-500 text-sm mb-3">

        Password must be at least 8 characters

      </p>

      <!-- Backend Error -->

      <p
        *ngIf="errorMessage"
        class="text-red-500 mb-3 text-center">

        {{ errorMessage }}

      </p>

      <button
        type="submit"
        class="w-full bg-black text-white p-2 rounded">

        Signup

      </button>

    </form>

    <p class="mt-3 text-sm text-center">

      Already have an account?

      <a
        routerLink="/login"
        class="text-blue-500">

        Login

      </a>

    </p>

  </div>

</div>
